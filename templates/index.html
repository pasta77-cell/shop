<!doctype html>
<html><head><meta charset="utf-8"><title>Shop</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body>
<h1>Sales</h1>
<div class="row">
<div class="col">
<input id="q" autofocus autocomplete="off" placeholder="search product">
<ul id="sug"></ul>
<div id="qtybox" style="display:none;">
  Qty: <input id="qty" type="number" value="1" min="1">
  <button id="addbtn">Add</button>
</div>
</div>
<div class="col">
<h2>Basket</h2>
<table id="basket"></table>
<p>Total: <span id="btotal">0.000</span> TND</p>
<button id="clear">Clear basket</button>
<button id="confirm">Confirm sale</button>
<div id="warn"></div>
</div>
</div>
<h2>Today's sales</h2>
<div id="today"></div>
<p><a href="/inventory"><button type="button">Inventory</button></a> <a href="/incoming"><button type="button">Incoming</button></a></p>
<script src="/static/app.js"></script>
</body></html>
