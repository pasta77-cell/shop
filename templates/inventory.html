<!doctype html>
<html><head><meta charset="utf-8"><title>Inventory - Shop</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body>
<h1>Inventory</h1>
<p><a href="/">Back to sales</a> | <a href="/incoming">Incoming</a></p>

<h2>Add product</h2>
<div id="addbox">
  <label>Name <input id="new-name" placeholder="required"></label>
  <label>Price (TND) <input id="new-price" placeholder="0.000" style="width:90px"></label>
  <label>Stock <input id="new-stock" placeholder="0" style="width:70px"></label>
  <label>Address <input id="new-address" placeholder="shelf/location"></label>
  <button id="add-product">Add product</button>
  <span id="addstatus"></span>
</div>

<h2>Articles</h2>
<input id="invq" placeholder="search inventory">
<span id="invcount"></span>
<span id="invstatus"></span>
<table id="invt"></table>

<script src="/static/inventory.js"></script>
</body></html>
